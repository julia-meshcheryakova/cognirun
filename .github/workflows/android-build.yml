name: Android APK

# Builds are slow and cost Actions minutes, so they only run for a release tag
# (git tag v1.2.0 && git push origin v1.2.0) or when started by hand.
# The APK carries no secrets: it talks to https://cognirun.vercel.app, which
# holds GROQ_API_KEY / ELEVENLABS_API_KEY server-side.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which no longer exists.
          packages: platform-tools

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root deps (Capacitor)
        run: npm ci

      - name: Build web app + sync Capacitor
        run: |
          npm run build:web
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../cognirun.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognirun-apk
          path: cognirun.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cognirun.apk
          generate_release_notes: true